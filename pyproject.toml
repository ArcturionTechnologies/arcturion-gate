[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arcturion-gate"
version = "0.1.0"
description = "Local encrypted credential store for AI agents: agents hold references, never values."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arcturion Technologies" }]
requires-python = ">=3.11"
dependencies = ["cryptography>=45"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
gate = "arcturion_gate.cli:main"
gate-mcp = "arcturion_gate.mcp_server.server:main"
gate-native = "arcturion_gate.mcp_server.native:main"
gate-bridge = "arcturion_gate.mcp_server.admin:main"

[tool.setuptools.packages.find]
where = ["src"]
